name: clean install

# Resolves the locked environment with the `tbccl` extra from an empty checkout and proves the adapter is installed and loads: `uv sync --no-dev --locked
# --extra tbccl`, then the doctor report and the exo entry point. The MLX extras are not part of this check (the macOS one compiles MLX from git, and the CUDA
# one is a multi-gigabyte download); they are covered by the physical qualification of the integration tag. It builds and publishes nothing and downloads no
# model. It runs weekly, by hand and when the setup helper or the lock changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 2"
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - tools/setup_tbccl.py
      - .github/workflows/clean-install.yml

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tbccl-extra:
    name: tbccl extra on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Linux x86-64", os: ubuntu-24.04}
          - {name: "macOS arm64", os: macos-15}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==0.9.18"
      - name: Locked sync with the tbccl extra
        run: uv sync --no-dev --locked --extra tbccl
      - name: Doctor report, adapter and runtime
        run: |
          uv run --no-sync python tools/setup_tbccl.py doctor | tee doctor.txt
          grep -q "'available': True" doctor.txt
          grep -q "'abi_version': 1" doctor.txt
      - name: The entry point starts
        run: uv run --no-sync exo --help > /dev/null
      - name: Summary
        if: always()
        run: |
          echo "tbccl extra on ${{ matrix.name }}: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
